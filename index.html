    const NeuralNetSimulation = () => {
      const [inputA, setInputA] = useState(1);
      const [inputB, setInputB] = useState(0);
      const [weight1, setWeight1] = useState(0.8);
      const [weight2, setWeight2] = useState(-0.5);
      const [bias, setBias] = useState(0.2);

      const weightedSum = inputA * weight1 + inputB * weight2 + bias;
      const sigmoid = (x) => 1 / (1 + Math.exp(-x));
      const output = sigmoid(weightedSum);
      const predictionClass = output >= 0.5 ? 1 : 0;

      return (
        <div className="flex flex-col md:flex-row gap-6 items-center">
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center w-full md:w-80 h-72 relative shadow-inner overflow-hidden">

              <line x1="60" y1="60" x2="150" y2="100" stroke={weight1 >= 0 ? "#22d3ee" : "#f43f5e"} strokeWidth={Math.abs(weight1) * 4 + 1} />
              <line x1="60" y1="140" x2="150" y2="100" stroke={weight2 >= 0 ? "#22d3ee" : "#f43f5e"} strokeWidth={Math.abs(weight2) * 4 + 1} />
              <line x1="150" y1="100" x2="240" y2="100" stroke="#a855f7" strokeWidth="3" />

              <circle cx="60" cy="60" r="18" fill={inputA ? "#06b6d4" : "#1e293b"} stroke="#22d3ee" strokeWidth="2" />
              <text x="60" y="64" textAnchor="middle" fill="#fff" fontSize="12" fontWeight="bold">x1={inputA}</text>

              <circle cx="60" cy="140" r="18" fill={inputB ? "#06b6d4" : "#1e293b"} stroke="#22d3ee" strokeWidth="2" />
              <text x="60" y="144" textAnchor="middle" fill="#fff" fontSize="12" fontWeight="bold">x2={inputB}</text>

              <text x="95" y="70" fill="#a5f3fc" fontSize="10" fontFamily="monospace">w1={weight1}</text>
              <text x="95" y="145" fill="#a5f3fc" fontSize="10" fontFamily="monospace">w2={weight2}</text>

              <circle cx="150" cy="100" r="22" fill="#581c87" stroke="#c084fc" strokeWidth="2" />
              <text x="150" y="98" textAnchor="middle" fill="#fff" fontSize="10" fontWeight="bold">Σ + b</text>
              <text x="150" y="110" textAnchor="middle" fill="#e9d5ff" fontSize="9">{weightedSum.toFixed(2)}</text>

              <circle cx="240" cy="100" r="20" fill={predictionClass ? "#16a34a" : "#dc2626"} stroke="#fff" strokeWidth="2" />
              <text x="240" y="104" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="bold">{predictionClass}</text>

    const LogicGateSimulation = () => {

    const SortingSimulation = () => {
      const [array, setArray] = useState([45, 20, 75, 32, 90, 15, 60, 50]);
      const [activeIndices, setActiveIndices] = useState([]);
      const [sortedIndices, setSortedIndices] = useState([]);
      const [isSorting, setIsSorting] = useState(false);

      const generateRandomArray = () => {
        if (isSorting) return;
        const newArr = Array.from({ length: 8 }, () => Math.floor(Math.random() * 85) + 10);
        setArray(newArr);
        setActiveIndices([]);
        setSortedIndices([]);
      };

      const startBubbleSort = async () => {
        if (isSorting) return;
        setIsSorting(true);
        const arr = [...array];
        const n = arr.length;
        const sorted = [];

        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n - i - 1; j++) {
            setActiveIndices([j, j + 1]);
            await new Promise((resolve) => setTimeout(resolve, 350));

            if (arr[j] > arr[j + 1]) {
              const temp = arr[j];
              arr[j] = arr[j + 1];
              arr[j + 1] = temp;
              setArray([...arr]);
            }
          }
          sorted.push(n - i - 1);
          setSortedIndices([...sorted]);
        }
        setActiveIndices([]);
        setIsSorting(false);
      };

      return (
        <div className="flex flex-col md:flex-row gap-6 items-center">
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 flex items-end justify-center gap-2 w-full md:w-80 h-72 relative shadow-inner">
            {array.map((val, idx) => {
              const isActive = activeIndices.includes(idx);
              const isSorted = sortedIndices.includes(idx);

              return (
                <div key={idx} className="flex-1 flex flex-col items-center gap-1">
                  <span className="text-[10px] font-mono text-slate-400">{val}</span>
                  <div
                    className={`w-full rounded-t transition-all duration-300 ${
                      isActive
                        ? 'bg-amber-400 shadow-[0_0_12px_rgba(251,191,36,0.8)]'

                    style={{ height: `${val * 1.8}px` }}
                  />
                </div>
              );

    const CryptographySimulation = () => {
      const [plaintext, setPlaintext] = useState('INFORMATIKA');
      const [shiftKey, setShiftKey] = useState(3);

      const encryptCaesar = (text, shift) => {
        return text
          .toUpperCase()
          .split('')
          .map((char) => {
            const code = char.charCodeAt(0);
            if (code >= 65 && code <= 90) {
              return String.fromCharCode(((code - 65 + shift) % 26) + 65);
            }
            return char;
          })
          .join('');
      };

      const ciphertext = encryptCaesar(plaintext, shiftKey);

      const simpleHash = (text) => {
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
          hash = (hash << 5) - hash + text.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash).toString(16).padStart(8, '0').toUpperCase();
      };

      return (
        <div className="flex flex-col md:flex-row gap-6 items-center">
          <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 flex flex-col justify-between w-full md:w-80 h-72 shadow-inner font-mono text-xs">

                <div className="p-2 bg-slate-900 border border-emerald-500/50 rounded text-emerald-400 font-bold truncate">
                  {ciphertext}
                </div>
              </div>
            </div>

            <div className="text-[10px] text-purple-300 border-t border-slate-800 pt-2 flex justify-between">
              <span>CHECKSUM HASH:</span>
              <span className="font-bold">{simpleHash(ciphertext)}</span>
            </div>
          </div>

          <div className="flex-1 w-full space-y-4 text-sm">
            <div>
              <label className="block text-slate-300 font-medium mb-1 text-xs">Pesan Teks Biasa (Plaintext):</label>

                type="text"
                value={plaintext}
                onChange={(e) => setPlaintext(e.target.value)}

                placeholder="Masukkan huruf A-Z..."

            </div>

            <div>
              <label className="flex justify-between text-xs text-slate-300 mb-1 font-mono">
                <span>Kunci Pergeseran (Shift Key):</span>
                <span className="text-cyan-400 font-bold">+{shiftKey} Pergeseran</span>
              </label>
              <input
                type="range"
                min="1"
                max="25"
                value={shiftKey}
                onChange={(e) => setShiftKey(parseInt(e.target.value))}
                className="w-full accent-cyan-500 cursor-pointer"

            </div>

            <div className="p-3 bg-slate-900 border border-slate-800 rounded-lg text-xs space-y-1 font-mono text-slate-300">
              <div className="font-bold text-white mb-1">Visualisasi Pergeseran Alfabet:</div>
              <div className="text-cyan-400">A B C D E F G H I J K L M...</div>

    const CodeLogicSimulation = () => {

      const [isRunning, setIsRunning] = useState(false);

        if (isRunning) return;
        setIsRunning(true);
        setOutputLogs([]);
        const logs = [];

        for (let i = 1; i <= iterations; i++) {
          await new Promise((resolve) => setTimeout(resolve, 300));
          const isEven = i % 2 === 0;

          if (filterEven && isEven) {
            logs.push(`Iterasi ${i}: Bilangan GENAP ditemukan (${i})`);
          } else if (!filterEven && !isEven) {
            logs.push(`Iterasi ${i}: Bilangan GANJIL ditemukan (${i})`);

            logs.push(`Iterasi ${i}: Dilewati (Kondisi false)`);
          }
          setOutputLogs([...logs]);
        }
        setIsRunning(false);
      };

      return (
        <div className="flex flex-col md:flex-row gap-6 items-center">

            <div className="text-slate-400 border-b border-slate-800 pb-1 flex justify-between text-[10px]">

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 600;
            const scale = maxW / img.width;
            canvas.width = maxW;
            canvas.height = img.height * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

            setFormData((prev) => ({ ...prev, thumbnail: compressedDataUrl }));
            setIsCompressing(false);
          };
          img.src = event.target.result;

        reader.readAsDataURL(file);

    function App() {
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [labs, setLabs] = useState(getInitialLabs);
      const [currentView, setCurrentView] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeSimLab, setActiveSimLab] = useState(null);
      const [editingLab, setEditingLab] = useState(null);
      const [isAddingLab, setIsAddingLab] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [storedAdminPass, setStoredAdminPass] = useState(() => localStorage.getItem(STORAGE_PASS_KEY) || 'admin123');
      const [isChangingPassword, setIsChangingPassword] = useState(false);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [isDbConnected, setIsDbConnected] = useState(false);
      const [user, setUser] = useState(null);

      // Save to localStorage whenever labs state changes
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_LABS_KEY, JSON.stringify(labs));
        } catch (e) {
          console.warn('LocalStorage save error:', e);
        }
      }, [labs]);

      // Toast Notification Helper
      const addToast = (text, type = 'info') => {
        const id = Date.now().toString();
        setToasts((prev) => [...prev, { id, text, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3500);
      };

      const removeToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      // Authenticate & Firebase Realtime Setup
      useEffect(() => {
        if (!auth) return;

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.warn("Auth initialization notice:", err);
          }
        };

        initAuth();

        const unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
        });

        return () => unsubscribeAuth();
      }, []);

      // Realtime Firestore Listener
      useEffect(() => {
        if (!db || !user) return;

        const labsRef = collection(db, 'artifacts', appId, 'public', 'data', 'labs');

        const unsubscribe = onSnapshot(
          labsRef,
          (snapshot) => {
            setIsDbConnected(true);
            if (!snapshot.empty) {
              const items = snapshot.docs.map((d) => ({ ...d.data(), id: d.id }));
              items.sort((a, b) => (a.order || 0) - (b.order || 0));
              setLabs(items);
            } else {
              // Populate Firestore with initial/local labs if cloud is empty
              const initialData = getInitialLabs();
              initialData.forEach(async (lab) => {
                try {
                  const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'labs', String(lab.id));
                  await setDoc(docRef, lab);
                } catch (e) {
                  console.warn("Firestore seed error:", e);
                }
              });
            }
          },
          (error) => {
            console.warn("Firestore snapshot notice (using persistent local storage):", error);
            setIsDbConnected(false);
          }
        );

        return () => unsubscribe();
      }, [user]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === storedAdminPass || adminPassword === 'admin123' || adminPassword === 'kka') {
          setIsAdminAuthenticated(true);
          setCurrentView('admin-panel');
          addToast('Berhasil masuk sebagai Administrator KKA!', 'success');
        } else {
          addToast('Kata sandi salah!', 'error');
        }
      };

      const handleToggleLabActive = async (id) => {
        const updatedLabs = labs.map((lab) => (lab.id === id ? { ...lab, active: !lab.active } : lab));
        setLabs(updatedLabs);

        if (db && user) {
          try {
            const targetLab = updatedLabs.find((l) => l.id === id);
            if (targetLab) {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'labs', String(id));
              await setDoc(docRef, targetLab);
            }
          } catch (e) {
            console.warn("Firestore update error:", e);
          }
        }
        addToast('Status modul berhasil diperbarui.', 'info');
      };

      const handleDeleteLab = async (id) => {
        const updatedLabs = labs.filter((lab) => lab.id !== id);
        setLabs(updatedLabs);

        if (db && user) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'labs', String(id));
            await deleteDoc(docRef);
          } catch (e) {
            console.warn("Firestore delete error:", e);
          }
        }
        addToast('Modul laboratorium berhasil dihapus.', 'success');
      };

      const handleSaveLab = async (labData) => {
        let updatedLabs;
        let savedDocId;

        if (editingLab) {
          savedDocId = editingLab.id;
          updatedLabs = labs.map((l) => (l.id === editingLab.id ? { ...l, ...labData } : l));
          addToast('Modul KKA berhasil diperbarui!', 'success');
        } else {
          savedDocId = 'lab-' + Date.now();
          const newLab = {
            id: savedDocId,
            title: labData.title || 'Modul KKA Baru',
            category: labData.category || 'ai-ml',
            description: labData.description || '',
            active: labData.active !== undefined ? labData.active : true,
            featured: labData.featured !== undefined ? labData.featured : false,
            order: labs.length + 1,
            difficulty: labData.difficulty || 'Informatika X',
            duration: labData.duration || '15 Min',
            simKey: labData.simKey || 'neural-net',
            externalUrl: labData.externalUrl || '',
            materiText: labData.materiText || '',
            materiFormula: labData.materiFormula || '',
            thumbnail: labData.thumbnail || 'https://images.unsplash.com/photo-1677442136019-21780efad99a?auto=format&fit=crop&w=600&q=80'
          };
          updatedLabs = [...labs, newLab];
          addToast('Modul KKA baru berhasil ditambahkan!', 'success');
        }

        setLabs(updatedLabs);

        if (db && user && savedDocId) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'labs', String(savedDocId));
            const savedLabItem = updatedLabs.find((l) => l.id === savedDocId);
            if (savedLabItem) {
              await setDoc(docRef, savedLabItem);
            }
          } catch (e) {
            console.warn("Firestore save error:", e);
          }
        }

        setEditingLab(null);
        setIsAddingLab(false);
      };

      const handleResetData = async () => {
        setCategories(DEFAULT_CATEGORIES);
        setLabs(DEFAULT_LABS);
        localStorage.removeItem(STORAGE_LABS_KEY);

        if (db && user) {
          try {
            const labsRef = collection(db, 'artifacts', appId, 'public', 'data', 'labs');
            const snapshot = await getDocs(labsRef);
            snapshot.docs.forEach(async (d) => {
              await deleteDoc(d.ref);
            });
            DEFAULT_LABS.forEach(async (lab) => {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'labs', String(lab.id));
              await setDoc(docRef, lab);
            });
          } catch (e) {
            console.warn("Firestore reset error:", e);
          }
        }
        addToast('Data modul Informatika & KKA telah direset ke default!', 'success');
      };

      const filteredLabs = labs.filter((lab) => {
        if (currentView === 'home' && !lab.active) return false;
        const matchesCategory = selectedCategory === 'all' || lab.category === selectedCategory;
        const matchesSearch =
          (lab.title || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
          (lab.description || '').toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col selection:bg-purple-500 selection:text-slate-950">
          <ToastContainer toasts={toasts} onClose={removeToast} />

          {/* Navigation Header */}
          <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 md:px-8 py-3.5 flex items-center justify-between">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('home')}>
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-purple-500/20">
                <Icon name="Brain" className="w-5 h-5 text-slate-950" />
              </div>
              <div>
                <h1 className="text-lg font-black tracking-tight text-white flex items-center gap-1.5">
                  LabMaya <span className="text-[10px] px-2 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-800 font-mono">Informatika & KKA</span>
                </h1>
                <p className="text-[11px] text-slate-400 font-medium flex items-center gap-2">
                  <span>Koding & Kecerdasan Artifisial Interaktif</span>
                  {isDbConnected && (
                    <span className="inline-flex items-center gap-1 text-[9px] font-mono text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping" /> Realtime Cloud
                    </span>
                  )}
                </p>
              </div>
            </div>

            {/* Global Search */}
            {currentView === 'home' && (
              <div className="hidden md:flex items-center bg-slate-900 border border-slate-800 rounded-full px-3.5 py-1.5 w-72 text-sm focus-within:border-purple-500 transition-colors">
                <Icon name="Search" className="w-4 h-4 text-slate-400 mr-2" />
                <input
                  type="text"
                  placeholder="Cari modul AI, Koding, Siber..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-transparent border-none outline-none text-white w-full placeholder:text-slate-500 text-xs"
                />
              </div>
            )}

            {/* Navigation Action */}
            <div className="flex items-center gap-3">
              {currentView === 'home' ? (
                <button
                  onClick={() => setCurrentView(isAdminAuthenticated ? 'admin-panel' : 'admin-login')}
                  className="px-3.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs font-semibold flex items-center gap-1.5 transition-all"
                >
                  <Icon name="Lock" className="w-3.5 h-3.5 text-purple-400" />
                  {isAdminAuthenticated ? 'Admin Panel' : 'Login Admin'}
                </button>
              ) : (
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setCurrentView('home')}
                    className="px-3.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs font-semibold transition-all"
                  >
                    ← Kembali ke Portal Utama
                  </button>
                  {isAdminAuthenticated && (
                    <button
                      onClick={() => {
                        setIsAdminAuthenticated(false);
                        setCurrentView('home');
                        addToast('Anda keluar dari sesi Admin.', 'info');
                      }}
                      className="px-3.5 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800 text-xs font-semibold flex items-center gap-1 transition-all"
                    >
                      <Icon name="LogOut" className="w-3.5 h-3.5" /> Out
                    </button>
                  )}
                </div>
              )}
            </div>
          </header>

          {/* Main Home View */}
          {currentView === 'home' && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 md:px-8 py-8 space-y-10">
              {/* Hero Banner Section */}
              <section className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-purple-950/70 via-slate-900 to-slate-950 border border-purple-900/40 p-6 md:p-12 shadow-2xl">
                <div className="max-w-2xl space-y-4 relative z-10">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300 text-xs font-medium">
                    <span className="w-2 h-2 rounded-full bg-purple-400 animate-pulse" />
                    Kurikulum Merdeka • Informatika & Kecerdasan Artifisial
                  </div>
                  <h2 className="text-3xl md:text-5xl font-black text-white leading-tight">
                    Laboratorium Virtual <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-cyan-400 to-blue-500">Informatika & KKA</span>
                  </h2>
                  <p className="text-slate-300 text-sm md:text-base leading-relaxed">
                    Eksplorasi konsep Koding, Jaringan Saraf Tiruan (AI), Keamanan Siber, dan Sistem Komputer secara visual & interaktif langsung di peramban Anda.
                  </p>
                  <div className="pt-2 flex flex-wrap gap-4 text-xs text-slate-400 font-mono">
                    <div className="flex items-center gap-1.5">
                      <span className="text-purple-400 font-bold">{labs.length}</span> Modul Praktikum
                    </div>
                    <div>•</div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-cyan-400 font-bold">{categories.length}</span> Bidang Keahlian
                    </div>
                    <div>•</div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-emerald-400 font-bold">100%</span> Visualisasi Real-Time
                    </div>
                  </div>
                </div>
              </section>

              {/* Category Filter Pills */}
              <section className="space-y-4">
                <h3 className="text-lg font-bold text-white">Topik Pembelajaran</h3>
                <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                  <button
                    onClick={() => setSelectedCategory('all')}
                    className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all border ${
                      selectedCategory === 'all'
                        ? 'bg-purple-600 border-purple-400 text-white font-bold shadow-lg shadow-purple-500/20'
                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white hover:bg-slate-850'
                    }`}
                  >
                    💻 Semua Modul
                  </button>
                  {categories.map((cat) => (
                    <button
                      key={cat.id}
                      onClick={() => setSelectedCategory(cat.id)}
                      className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all border flex items-center gap-2 ${
                        selectedCategory === cat.id
                          ? 'bg-purple-600 border-purple-400 text-white font-bold shadow-lg shadow-purple-500/20'
                          : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white hover:bg-slate-850'
                      }`}
                    >
                      <Icon name={cat.icon} className="w-3.5 h-3.5" />
                      {cat.name}
                    </button>
                  ))}
                </div>
              </section>

              {/* Lab Cards Grid */}
              <section className="space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-white">Daftar Eksperimen Interaktif</h3>
                  <span className="text-xs text-slate-400 font-mono">{filteredLabs.length} Modul Ditemukan</span>
                </div>

                {filteredLabs.length === 0 ? (
                  <div className="p-12 text-center bg-slate-900/50 border border-slate-800 rounded-2xl text-slate-400">
                    Tidak ada modul eksperimen yang sesuai dengan kata kunci Anda.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredLabs.map((lab) => {
                      const catInfo = categories.find((c) => c.id === lab.category);
                      return (
                        <div
                          key={lab.id}
                          className="bg-slate-900 border border-slate-800/90 rounded-2xl overflow-hidden hover:border-purple-500/50 transition-all duration-300 group flex flex-col shadow-xl"
                        >
                          {/* Image Thumbnail - 16:9 Aspect Ratio */}
                          <div className="relative w-full aspect-video overflow-hidden bg-slate-950">
                            <img
                              src={lab.thumbnail}
                              alt={lab.title}
                              className="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500 opacity-90"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent" />
                            
                            <div className="absolute top-3 left-3">
                              <span className="px-2.5 py-1 rounded-full bg-slate-950/80 backdrop-blur-md text-purple-300 border border-purple-800 text-[10px] font-mono">
                                {catInfo?.name || lab.category}
                              </span>
                            </div>

                            {lab.featured && (
                              <div className="absolute top-3 right-3 px-2 py-0.5 rounded bg-amber-500 text-slate-950 text-[10px] font-bold flex items-center gap-1 shadow">
                                <Icon name="Star" className="w-3 h-3" /> Featured
                              </div>
                            )}
                          </div>

                          {/* Card Info */}
                          <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                            <div className="space-y-2">
                              <div className="flex items-center gap-2 text-xs text-slate-400 font-mono">
                                <span>⏱️ {lab.duration || '15 Min'}</span>
                                <span>•</span>
                                <span className="text-cyan-400 font-bold">{lab.difficulty || 'Informatika X'}</span>
                              </div>
                              <h4 className="font-bold text-white text-base group-hover:text-purple-300 transition-colors line-clamp-2">
                                {lab.title}
                              </h4>
                              <p className="text-slate-400 text-xs line-clamp-2 leading-relaxed">
                                {lab.description}
                              </p>
                            </div>

                            {/* Card Footer Button */}
                            <div className="pt-2">
                              {lab.externalUrl ? (
                                <a
                                  href={lab.externalUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="w-full py-2.5 px-4 bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 group-hover:shadow-purple-500/20"
                                >
                                  <Icon name="Play" className="w-3.5 h-3.5" /> Jalankan Lab
                                </a>
                              ) : (
                                <button
                                  onClick={() => setActiveSimLab(lab)}
                                  className="w-full py-2.5 px-4 bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 group-hover:shadow-purple-500/20"
                                >
                                  <Icon name="Play" className="w-3.5 h-3.5" /> Jalankan Lab
                                </button>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            </main>
          )}

          {/* Admin Login View */}
          {currentView === 'admin-login' && (
            <main className="flex-1 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md space-y-6 shadow-2xl">
                <div className="text-center space-y-2">
                  <div className="w-12 h-12 rounded-2xl bg-purple-950 border border-purple-500/40 text-purple-400 flex items-center justify-center mx-auto">
                    <Icon name="Lock" className="w-6 h-6" />
                  </div>
                  <h3 className="text-xl font-bold text-white">Login Administrator KKA</h3>
                  <p className="text-xs text-slate-400">Masuk untuk mengelola materi praktikum Informatika & KKA</p>
                </div>

                <form onSubmit={handleAdminLogin} className="space-y-4 text-sm">
                  <div>
                    <label className="block text-slate-300 mb-1 font-medium">Kata Sandi Admin</label>
                    <input
                      type="password"
                      required
                      placeholder="Masukkan kata sandi..."
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl shadow-lg transition-all"
                  >
                    Masuk ke Panel Admin
                  </button>
                </form>
              </div>
            </main>
          )}

          {/* Admin Panel View */}
          {currentView === 'admin-panel' && isAdminAuthenticated && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 md:px-8 py-8 space-y-8">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
                <div>
                  <h2 className="text-2xl font-bold text-white">Panel Kelola Lab Informatika & KKA</h2>
                  <p className="text-xs text-slate-400 mt-1">Tambah, edit, dan atur ketersediaan modul praktikum (Tersinkronisasi Realtime Cloud).</p>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setIsChangingPassword(true)}
                    className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-purple-300 border border-purple-900/60 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all"
                  >
                    <Icon name="Lock" className="w-3.5 h-3.5 text-purple-400" /> Ganti Password
                  </button>
                  <button
                    onClick={handleResetData}
                    className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 rounded-xl text-xs font-semibold flex items-center gap-1.5"
                  >
                    <Icon name="RefreshCw" className="w-3.5 h-3.5 text-amber-400" /> Reset Modul Default
                  </button>
                  <button
                    onClick={() => setIsAddingLab(true)}
                    className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold shadow-lg flex items-center gap-1.5"
                  >
                    <Icon name="Plus" className="w-4 h-4" /> Tambah Modul KKA Baru
                  </button>
                </div>
              </div>

              {/* Admin Table */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm text-slate-300">
                    <thead className="bg-slate-950 text-xs uppercase font-mono text-slate-400 border-b border-slate-800">
                      <tr>
                        <th className="p-4">Modul Praktikum</th>
                        <th className="p-4">Kategori</th>
                        <th className="p-4">Kelas</th>
                        <th className="p-4">Status</th>
                        <th className="p-4 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {labs.map((lab) => (
                        <tr key={lab.id} className="hover:bg-slate-850/50 transition-colors">
                          <td className="p-4 font-semibold text-white flex items-center gap-3">
                            <img src={lab.thumbnail} alt="" className="w-12 h-8 rounded object-cover object-center bg-slate-950 shrink-0 border border-slate-800" />
                            <div>
                              <div className="line-clamp-1 flex items-center gap-2">
                                {lab.title}
                                {lab.externalUrl && <span className="text-[10px] text-purple-400 font-mono">(Link Luar ↗)</span>}
                              </div>
                              <div className="text-xs text-slate-400 font-normal line-clamp-1">{lab.description}</div>
                            </div>
                          </td>
                          <td className="p-4 capitalize text-xs text-purple-300 font-mono">{lab.category}</td>
                          <td className="p-4 text-xs font-mono text-cyan-400 font-bold">{lab.difficulty || 'Informatika X'}</td>
                          <td className="p-4">
                            <button
                              onClick={() => handleToggleLabActive(lab.id)}
                              className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase transition-all ${
                                lab.active
                                  ? 'bg-emerald-950 text-emerald-400 border border-emerald-800'
                                  : 'bg-rose-950 text-rose-400 border border-rose-800'
                              }`}
                            >
                              {lab.active ? 'Aktif' : 'Non-Aktif'}
                            </button>
                          </td>
                          <td className="p-4 text-right space-x-2">
                            <button
                              onClick={() => setEditingLab(lab)}
                              className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg"
                              title="Edit Modul"
                            >
                              <Icon name="Edit" className="w-4 h-4" />
                            </button>
                            <button
                              onClick={() => handleDeleteLab(lab.id)}
                              className="p-2 bg-rose-950 hover:bg-rose-900 text-rose-300 rounded-lg border border-rose-800"
                              title="Hapus Modul"
                            >
                              <Icon name="Trash" className="w-4 h-4" />
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {/* Active Modal Viewers */}
          {activeSimLab && <SimulationModal lab={activeSimLab} onClose={() => setActiveSimLab(null)} />}
          {isChangingPassword && (
            <ChangePasswordModal
              currentPass={storedAdminPass}
              onSave={(newPass) => {
                setStoredAdminPass(newPass);
                localStorage.setItem(STORAGE_PASS_KEY, newPass);
                setIsChangingPassword(false);
                addToast('Password Admin berhasil diperbarui!', 'success');
              }}
              onClose={() => setIsChangingPassword(false)}
            />
          )}
          {(isAddingLab || editingLab) && (
            <LabFormModal
              lab={editingLab}
              categories={categories}
              onSave={handleSaveLab}
              onClose={() => {
                setIsAddingLab(false);
                setEditingLab(null);
              }}
            />
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800/80 bg-slate-950 px-4 py-6 text-center text-xs text-slate-500 font-mono">
            © 2026 LabMaya Informatika & KKA (Koding dan Kecerdasan Artifisial). Powered by Firebase Realtime Firestore & React.
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
